version: 1

project:
  name: IntentLock

defaults:
  base: main

invariants:
  - id: protect-project-contracts
    type: file_scope
    description: Keep selected toolchain configuration stable during ordinary feature work.
    severity: error
    deny:
      - "tsconfig.json"
      - "tsup.config.ts"
      - "eslint.config.js"
      - ".prettierrc.json"

  - id: no-new-dependencies
    type: dependency_policy
    description: Do not add runtime or development dependencies without an explicit policy change.
    severity: error
    manifests:
      - "package.json"
    allow_additions: false
    allow_removals: true
    allow_version_changes: true

  - id: protect-test-script
    type: structured_value
    description: Keep the test command stable during ordinary feature work.
    severity: error
    file: "package.json"
    format: json
    selector: "$.scripts.test"
    expectation: unchanged

  - id: protect-build-script
    type: structured_value
    description: Keep the build command stable during ordinary feature work.
    severity: error
    file: "package.json"
    format: json
    selector: "$.scripts.build"
    expectation: unchanged

  - id: protect-lint-script
    type: structured_value
    description: Keep the lint command stable during ordinary feature work.
    severity: error
    file: "package.json"
    format: json
    selector: "$.scripts.lint"
    expectation: unchanged

  - id: protect-typecheck-script
    type: structured_value
    description: Keep the typecheck command stable during ordinary feature work.
    severity: error
    file: "package.json"
    format: json
    selector: "$.scripts.typecheck"
    expectation: unchanged

  - id: regression-tests
    type: command
    description: The complete test suite must pass.
    severity: error
    run: "corepack pnpm test"
    timeout_seconds: 180
